name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install gitleaks ripgrep swiftlint

      - name: Install pinned XcodeGen
        run: |
          ./scripts/install-xcodegen.sh \
            "$XCODEGEN_VERSION" \
            "$XCODEGEN_SHA256" \
            "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Scan tracked files for secrets
        run: gitleaks dir --no-banner --redact --exit-code 1 .

      - name: Confirm there are no third-party runtime packages
        run: |
          if rg --quiet 'XCRemoteSwiftPackageReference' NoteNerds.xcodeproj/project.pbxproj; then
            echo "Third-party package references require a security review."
            exit 1
          fi

      - name: Test release tooling
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v

      - name: Regenerate Xcode project
        run: xcodegen generate

      - name: Check generated project is committed
        run: git diff --exit-code

      - name: Lint Swift
        run: swiftlint lint --strict --cache-path "$RUNNER_TEMP/swiftlint-cache"

      - name: Select iPad simulator
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if ".iOS-" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPad"):
                      candidates.append((runtime, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPad simulator")
          print(sorted(candidates)[-1][2])
          ')"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Run behavior tests
        run: |
          xcodebuild test -quiet \
            -project NoteNerds.xcodeproj \
            -scheme NoteNerds \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/BehaviorTests.xcresult" \
            -only-testing:NoteNerdsTests

      - name: Run performance checks
        run: |
          xcodebuild test -quiet \
            -project NoteNerds.xcodeproj \
            -scheme NoteNerds \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PerformanceTests.xcresult" \
            -only-testing:NoteNerdsPerformanceTests

      - name: Run Xcode static analysis
        run: |
          xcodebuild analyze -quiet \
            -project NoteNerds.xcodeproj \
            -scheme NoteNerds \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AnalyzeDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run launch check
        run: |
          xcodebuild test -quiet \
            -project NoteNerds.xcodeproj \
            -scheme NoteNerds \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/LaunchTests.xcresult" \
            -only-testing:NoteNerdsUITests/NoteNerdsLaunchTests/testApplicationLaunchesIntoLibrary

      - name: Upload test results after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7
