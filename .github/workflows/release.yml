name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release destination
        required: true
        default: testflight
        type: choice
        options:
          - testflight
          - app-store
      version:
        description: App Store version, required for app-store
        required: false
        type: string
      notes:
        description: TestFlight or App Store release notes
        required: true
        type: string
      submit_review:
        description: Submit the App Store version for review after upload
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: note-nerds-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.channel }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: app-store
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
      SUBMIT_REVIEW: ${{ inputs.submit_review }}

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install xcodegen

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install release dependencies
        run: ./scripts/ship.py --bootstrap

      - name: Verify Doppler access and materialize the App Store key
        run: |
          doppler run --project notenerds --config prd -- bash -euo pipefail -c '
            : "${ASC_KEY_ID:?ASC_KEY_ID is required}"
            : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is required}"
            : "${ASC_PRIVATE_KEY:?ASC_PRIVATE_KEY is required}"
            mkdir -p "$HOME/.private_keys"
            chmod 700 "$HOME/.private_keys"
            printf "%s\n" "$ASC_PRIVATE_KEY" > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
            chmod 600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          '

      - name: Build and release
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((GITHUB_RUN_NUMBER + 1000))
          if [[ "$RELEASE_CHANNEL" == "testflight" ]]; then
            doppler run --project notenerds --config prd -- \
              ./scripts/ship.py testflight \
                --build-number "$build_number" \
                --notes "$RELEASE_NOTES"
            exit 0
          fi

          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "version is required for an App Store release" >&2
            exit 1
          fi

          args=(app-store --version "$RELEASE_VERSION" --build-number "$build_number" --notes "$RELEASE_NOTES")
          if [[ "$SUBMIT_REVIEW" != "true" ]]; then
            args+=(--skip-submit)
          fi
          doppler run --project notenerds --config prd -- ./scripts/ship.py "${args[@]}"

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-nerds-${{ inputs.channel }}-${{ github.run_number }}
          path: |
            dist/*.log
            dist/*.txt
            dist/export-*/*.ipa
          if-no-files-found: ignore
          retention-days: 14
