name: NoteNerds
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.strategicnerds
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "26"
    DEVELOPMENT_TEAM: "955GSY56UT"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    LM_FILTER_WARNINGS: YES
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NoteNerds:
    type: application
    platform: iOS
    info:
      path: NoteNerds/Info.plist
      properties:
        CFBundleDisplayName: Note Nerds
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.strategicnerds.notenerds
            CFBundleURLSchemes:
              - notenerds
        ITSAppUsesNonExemptEncryption: false
        NNNotionClientIDBase64: $(NOTION_CLIENT_ID_B64)
        NNNotionClientSecretBase64: $(NOTION_CLIENT_SECRET_B64)
        LSApplicationCategoryType: public.app-category.productivity
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.strategicnerds.notenerds.notebook
            UTTypeDescription: Note Nerds editable notebook
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - notenerds
        CFBundleDocumentTypes:
          - CFBundleTypeName: Note Nerds editable notebook
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.strategicnerds.notenerds.notebook
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
    sources:
      - path: NoteNerds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.notenerds
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NoteNerds/NoteNerds.entitlements
  NoteNerdsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoteNerdsTests
    dependencies:
      - target: NoteNerds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.notenerds.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NoteNerds.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NoteNerds"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NoteNerdsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NoteNerdsUITests
    dependencies:
      - target: NoteNerds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.notenerds.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NoteNerds
  NoteNerdsPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoteNerdsPerformanceTests
    dependencies:
      - target: NoteNerds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.notenerds.performance-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NoteNerds.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NoteNerds"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  NoteNerds:
    build:
      targets:
        NoteNerds: all
        NoteNerdsTests: [test]
        NoteNerdsUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: NoteNerdsTests
          parallelizable: true
        - name: NoteNerdsUITests
          parallelizable: false
        - name: NoteNerdsPerformanceTests
          parallelizable: false
