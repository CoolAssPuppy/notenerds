[project]
name = "NoteNerds"
display_name = "Note Nerds"
bundle_id = "com.strategicnerds.notenerds"
team_id = "955GSY56UT"
scheme = "NoteNerds"
ios_root = "."
xcodeproj = "NoteNerds.xcodeproj"
project_yml = "project.yml"
xcodegen_version = "2.46.0"
dist_dir = "dist"
min_ios = "18.0"
device_family = "1,2"

[asc]
key_dir = "~/.private_keys"

[signing]
certificate = "Apple Distribution"
profile_name = "Note Nerds App Store"

[doppler]
project = "notenerds"
config = "prd"
secrets = ["ASC_KEY_ID", "ASC_ISSUER_ID", "ASC_APP_ID", "NOTION_CLIENT_ID", "NOTION_CLIENT_SECRET"]

[release]
release_type = "MANUAL"
locale = "en-US"
default_notes = "Bug fixes and performance improvements."

[env_files]
paths = [".env"]
